<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras Interativa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Lista de Compras Interativa</h1>
    <form id="form">
      <label for="produto">Produto</label>
      <input type="text" id="produto" placeholder="Ex: Maçã" required />

      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" min="1" value="1" required />

      <button type="submit">Adicionar Item</button>
    </form>
    <img src="'https://images.unsplash.com/photo-1606787366850-de6330128bfc'" alt="">
    <ul id="lista-itens"></ul>

    <button id="limpar-lista" class="limpar">Limpar Lista</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
